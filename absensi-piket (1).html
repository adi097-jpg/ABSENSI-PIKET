<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piket.id — Absensi Piket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg: #F6F4EF;
    --paper: #FFFFFF;
    --ink: #1B2A41;
    --ink-soft: #46536B;
    --amber: #E8A33D;
    --amber-deep: #C97F1E;
    --green: #3F8F5F;
    --green-bg: #E7F3EC;
    --coral: #D6604D;
    --coral-bg: #FBEAE7;
    --slate: #8A94A6;
    --line: #E4E0D5;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Sora',sans-serif; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border:none; }
  input, select{ font-family:'Inter',sans-serif; }

  #app{ max-width:920px; margin:0 auto; padding:28px 18px 60px; }

  /* ---------- ROLE SELECT ---------- */
  .role-screen{
    min-height:80vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    gap:34px;
  }
  .brandmark{
    display:flex; align-items:center; gap:10px;
  }
  .brandmark .dot{
    width:14px; height:14px; border-radius:3px; background:var(--amber);
    transform:rotate(45deg);
  }
  .brandmark span{ font-family:'Sora',sans-serif; font-weight:800; font-size:22px; letter-spacing:-0.02em; }
  .role-screen p.tag{ color:var(--ink-soft); margin:-22px 0 0; font-size:15px; }
  .role-cards{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .role-card{
    width:230px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px 20px; text-align:left; transition:transform .15s ease, box-shadow .15s ease, border-color .15s;
    box-shadow:0 1px 2px rgba(27,42,65,0.04);
  }
  .role-card:hover{ transform:translateY(-3px); box-shadow:0 10px 24px rgba(27,42,65,0.08); border-color:var(--amber); }
  .role-card .icon{ font-size:26px; margin-bottom:14px; display:block; }
  .role-card h3{ margin:0 0 6px; font-size:17px; }
  .role-card p{ margin:0; color:var(--ink-soft); font-size:13.5px; line-height:1.5; }

  /* ---------- HEADER ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px; gap:12px; flex-wrap:wrap;
  }
  .topbar .back{
    background:none; color:var(--ink-soft); font-size:13.5px; padding:6px 0;
    display:flex; align-items:center; gap:5px;
  }
  .topbar .back:hover{ color:var(--ink); }
  .today-pill{
    background:var(--paper); border:1px solid var(--line); border-radius:999px;
    padding:6px 14px; font-size:12.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;
  }

  /* ---------- CARD / FORM (SISWA) ---------- */
  .panel{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px; margin-bottom:18px;
  }
  .panel h2{ font-size:20px; margin:0 0 4px; }
  .panel .sub{ color:var(--ink-soft); font-size:13.5px; margin:0 0 20px; }

  label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em; }
  .field{ margin-bottom:16px; }
  .field input[type=text], .field select{
    width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:9px;
    font-size:14.5px; background:#FCFBF8; color:var(--ink);
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--amber); background:#fff; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:520px){ .row2{ grid-template-columns:1fr; } }

  /* ticket-style before/after */
  .ticket{
    border:1.5px dashed var(--line); border-radius:12px; padding:18px; margin:22px 0;
    display:grid; grid-template-columns:1fr 1fr; gap:0;
    position:relative;
  }
  @media(max-width:560px){ .ticket{ grid-template-columns:1fr; } .ticket .divider{ display:none; } }
  .ticket .divider{
    position:absolute; left:50%; top:8px; bottom:8px; border-left:1.5px dashed var(--line);
  }
  .slot{ padding:6px 20px; text-align:center; }
  .slot .label-eyebrow{ font-size:11px; letter-spacing:.08em; color:var(--slate); text-transform:uppercase; font-weight:600; margin-bottom:10px; }
  .photo-box{
    width:100%; aspect-ratio:4/3; border-radius:10px; background:#F1EEE6;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    border:1px solid var(--line); position:relative;
  }
  .photo-box img{ width:100%; height:100%; object-fit:cover; }
  .photo-box .placeholder{ color:var(--slate); font-size:12.5px; text-align:center; padding:10px; }
  .upload-btn{
    margin-top:10px; width:100%; padding:9px; border-radius:8px; font-size:13px; font-weight:600;
    background:var(--ink); color:#fff;
  }
  .upload-btn:disabled{ background:#D5D1C6; color:#8A857A; cursor:not-allowed; }
  .upload-btn.done{ background:var(--green); }
  .timestamp{ margin-top:8px; font-size:11.5px; color:var(--slate); font-family:'JetBrains Mono',monospace; }

  .submit-btn{
    width:100%; padding:14px; background:var(--amber); color:#3A2705; font-weight:700; font-size:15px;
    border-radius:10px; transition:background .15s;
  }
  .submit-btn:hover{ background:var(--amber-deep); color:#fff; }
  .submit-btn:disabled{ background:#E9E5D8; color:#A8A392; cursor:not-allowed; }

  .status-msg{ text-align:center; padding:12px; border-radius:9px; font-size:13.5px; font-weight:600; margin-top:12px; }
  .status-msg.ok{ background:var(--green-bg); color:var(--green); }
  .status-msg.err{ background:var(--coral-bg); color:var(--coral); }

  /* ---------- ADMIN LOGIN ---------- */
  .login-box{ max-width:340px; margin:60px auto; text-align:center; }
  .login-box input{
    width:100%; padding:13px; border:1.5px solid var(--line); border-radius:9px; font-size:16px;
    text-align:center; letter-spacing:.3em; margin:16px 0; font-family:'JetBrains Mono',monospace;
  }
  .login-box button{ width:100%; padding:12px; background:var(--ink); color:#fff; border-radius:9px; font-weight:600; }

  /* ---------- ADMIN DASHBOARD ---------- */
  .admin-toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
  .admin-toolbar input[type=date], .admin-toolbar input[type=text]{
    padding:9px 12px; border:1.5px solid var(--line); border-radius:8px; font-size:13.5px; background:#fff;
  }
  .admin-toolbar .spacer{ flex:1; }
  .stat-strip{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .stat{
    flex:1; min-width:120px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
  }
  .stat .n{ font-family:'Sora',sans-serif; font-weight:800; font-size:24px; }
  .stat .l{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; }

  table{ width:100%; border-collapse:collapse; background:var(--paper); border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:12px 14px; background:#FAF8F3; border-bottom:1px solid var(--line); }
  td{ padding:10px 14px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .thumb{ width:46px; height:46px; border-radius:8px; object-fit:cover; cursor:pointer; border:1px solid var(--line); background:#F1EEE6; }
  .thumb.empty{ display:flex; align-items:center; justify-content:center; color:var(--slate); font-size:16px; }
  .badge{ display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge.done{ background:var(--green-bg); color:var(--green); }
  .badge.wait{ background:#FDF3E3; color:var(--amber-deep); }
  .del-btn{ background:none; color:var(--coral); font-size:12px; font-weight:600; padding:4px 8px; }
  .del-btn:hover{ text-decoration:underline; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--slate); }
  .empty-state .icon{ font-size:30px; margin-bottom:10px; }

  .lightbox{
    position:fixed; inset:0; background:rgba(27,42,65,0.85); display:none; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .lightbox.show{ display:flex; }
  .lightbox img{ max-width:100%; max-height:85vh; border-radius:10px; }
  .lightbox .close{ position:absolute; top:20px; right:24px; background:none; color:#fff; font-size:28px; }

  .footer-note{ text-align:center; color:var(--slate); font-size:11.5px; margin-top:24px; }
  .hidden{ display:none !important; }
  .loader{ text-align:center; padding:30px; color:var(--slate); font-size:13px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="lightbox" id="lightbox"><button class="close" onclick="closeLightbox()">&times;</button><img id="lightbox-img" src=""></div>

<script>
const ADMIN_PIN = "1234"; // ganti PIN admin di sini

// ==== KONFIGURASI FIREBASE — ganti dengan config dari project Firebase kamu ====
const firebaseConfig = {
  apiKey: "AIzaSyAXksXTarkGQYbR-_vbj3Mh1e_j4tQBFPA",
  authDomain: "absensi-24efe.firebaseapp.com",
  projectId: "absensi-24efe",
  storageBucket: "absensi-24efe.firebasestorage.app",
  messagingSenderId: "165477128750",
  appId: "1:165477128750:web:336ecfbb89d383404b9dbf"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const PIKET_COLLECTION = "piket"; // nama koleksi di Firestore
// ================================================================

// Daftar siswa per kelas — tambah kelas/nama baru di sini sesuai kebutuhan
const ROSTER = {
  "XI DKV 1": [
    "ACHMAD REYHAN","AHMAD FAISAL HABIBI","AHMAD RAFI AL AZHAR","ARIF SAPUTRA",
    "ATIKA WULANDARI","AYU INDAHYANI","DINI AWALIYAH NUR SASQIA","FAHRI SAPUTRA ALIANSYAH",
    "FARADILLA MEYSUN MANOPPO","HENDI NAZAR PRASTYA","KAYLA SHOFA SALSABILA","LIQA AULIA",
    "MAHARANI YUNIAN AL-ANSYAH","MARDANI ROSIDDIN","MUHAMMAD FIRMAN","MUHAMMAD HASAN",
    "MUHAMMAD IHSAN MUBAROK","MUHAMMAD RIZQI PUTRA ANANDA","NEVEANTI","NEYLA TALITA AZKA SALSABILA",
    "PELIZA MARLLIYANTI","RASHTI SEPTIANI","RIFALDI","SITI RAHMAH",
    "SRI REIZKI DWI ANUGRAHAENI","SYAHRANI","UMAR"
  ],
  "XI DKV 2": [
    "AFIFAH OCTAVIANI PUTRI","AHMAD NASIKH FAHMI","AHMAD RUZAIQI","BASO AFDANUL FIRNANDA",
    "CALLYSTA OTNIEL YEOH","DAVIN CAKRA ARIYANTO","FAUZIYYAH ADILAH RAMADHANI","GRASENA ROSSYLITA OKTARINA",
    "HANI NUR HIDAYAH","LAILA FAUZIAH","MOH RIYAN DIKA","MUHAMAD ADITTIA HASBYA ULUDDINNUR",
    "MUHAMMAD ABDAN FAHREZA","MUHAMMAD HENDRA","MUHAMMAD RIZKY","NA'ILAH SYAVIRA HUSNAH",
    "NABILA ALMEKA","NAUFAL DZAKI AL FAIQ","RAISA SASMITA","RETNO PRIMA KUSUMA AYU",
    "RISHTA OKTAVIAN","SHERLY NOVITA PUTRI","TALITA KHAIRUNISA","YUNANTYO DWI PRASETYO ADHI"
  ],
  "XI DKV 3": [
    "ABDURRAHMAN ADITYA ALMADANI","AHMAD DAUDI","ALIEF AL BUKHARI","AULIA AZIZAH",
    "DEWI YASMINE","FAHMI DJIKRI","HAMKA ADIKA PRATAMA","HERNISYA",
    "IRMA MAURANI","MUHAMMAD FAKHRI NUR","MUHAMMAD FAKHRY WILDAN","MUHAMMAD FATHAN SYAH",
    "MUHAMMAD NAUFAL SARIPI","MUHAMMAD RAGIL RAMADHANI","MUHAMMAD ZAINI","NABILA CINTA DEWI",
    "NARADILLA MEYSUN MANOPPO","NOFRIANSYAH","NURUL HUDA","RAHMI",
    "RAKHA' MUBAROK","REYHAAN NAUVAL IBRAHIM","SHELA RAHMAWATI","TRITIA ATIKA SARI",
    "ZIRA BILQIS MAULIDA"
  ]
};

const app = document.getElementById('app');
let state = { view: 'role' }; // role | siswa | admin-login | admin
let adminDate = todayStr();
let adminSearch = '';

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowTime(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function slug(s){ return (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function fmtDate(iso){
  const [y,m,d]=iso.split('-');
  const bulan=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return d+' '+bulan[parseInt(m,10)-1]+' '+y;
}

function render(){
  if(state.view==='role') return renderRole();
  if(state.view==='siswa') return renderSiswa();
  if(state.view==='admin-login') return renderAdminLogin();
  if(state.view==='admin') return renderAdmin();
}

/* ---------------- ROLE SELECT ---------------- */
function renderRole(){
  app.innerHTML = `
    <div class="role-screen">
      <div class="brandmark"><div class="dot"></div><span>Piket.id</span></div>
      <p class="tag">Absensi piket dengan bukti foto sebelum &amp; sesudah</p>
      <div class="role-cards">
        <div class="role-card" onclick="goSiswa()">
          <span class="icon">🧹</span>
          <h3>Siswa Piket</h3>
          <p>Kirim foto sebelum dan sesudah piket hari ini.</p>
        </div>
        <div class="role-card" onclick="goAdminLogin()">
          <span class="icon">🗂️</span>
          <h3>Admin / Guru</h3>
          <p>Pantau rekap absensi piket seluruh siswa.</p>
        </div>
      </div>
    </div>`;
}
function goSiswa(){ state.view='siswa'; state.form={nama:'',kelas:'',before:null,beforeTime:null,after:null,afterTime:null,saving:false,msg:null}; render(); }
function goAdminLogin(){ state.view='admin-login'; render(); }

/* ---------------- SISWA FLOW ---------------- */
function renderSiswa(){
  const f = state.form;
  app.innerHTML = `
    <div class="topbar">
      <button class="back" onclick="backToRole()">&larr; Kembali</button>
      <div class="today-pill">${fmtDate(todayStr())}</div>
    </div>
    <div class="panel">
      <h2>Absensi Piket</h2>
      <p class="sub">Isi data lalu unggah foto sebelum dan sesudah piket.</p>

      <div class="row2">
        <div class="field">
          <label>Kelas</label>
          <select id="in-kelas" onchange="f_kelasChange(this.value)">
            <option value="">Pilih kelas</option>
            ${Object.keys(ROSTER).map(k => `<option value="${k}" ${f.kelas===k?'selected':''}>${k}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Nama</label>
          <select id="in-nama" onchange="f_update('nama', this.value)" ${!f.kelas?'disabled':''}>
            <option value="">${f.kelas ? 'Pilih nama' : 'Pilih kelas dulu'}</option>
            ${(ROSTER[f.kelas]||[]).map(n => `<option value="${n}" ${f.nama===n?'selected':''}>${n}</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="ticket">
        <div class="divider"></div>
        <div class="slot">
          <div class="label-eyebrow">Sebelum Piket</div>
          <div class="photo-box">
            ${f.before ? `<img src="${f.before}">` : `<div class="placeholder">Belum ada foto</div>`}
          </div>
          <input type="file" accept="image/*" capture="environment" id="file-before" class="hidden" onchange="handlePhoto('before', this)">
          <button class="upload-btn ${f.before?'done':''}" onclick="document.getElementById('file-before').click()">${f.before?'Ganti Foto ✓':'Ambil / Unggah Foto'}</button>
          ${f.beforeTime? `<div class="timestamp">Diambil ${f.beforeTime}</div>`:''}
        </div>
        <div class="slot">
          <div class="label-eyebrow">Sesudah Piket</div>
          <div class="photo-box">
            ${f.after ? `<img src="${f.after}">` : `<div class="placeholder">Belum ada foto</div>`}
          </div>
          <input type="file" accept="image/*" capture="environment" id="file-after" class="hidden" onchange="handlePhoto('after', this)">
          <button class="upload-btn ${f.after?'done':''}" ${!f.before?'disabled':''} onclick="document.getElementById('file-after').click()">${f.after?'Ganti Foto ✓':'Ambil / Unggah Foto'}</button>
          ${f.afterTime? `<div class="timestamp">Diambil ${f.afterTime}</div>`:''}
        </div>
      </div>

      <button class="submit-btn" id="submit-btn" ${(!f.nama||!f.kelas||!f.before)||f.saving?'disabled':''} onclick="submitPiket()">
        ${f.saving? 'Menyimpan...' : 'Kirim Absensi'}
      </button>
      ${f.msg ? `<div class="status-msg ${f.msg.ok?'ok':'err'}">${f.msg.text}</div>` : ''}
    </div>
    <p class="footer-note">Data absensi ini tersimpan bersama dan dapat dilihat oleh admin/guru piket.</p>
  `;
}
function f_update(key,val){ state.form[key]=val; }
function f_kelasChange(val){ state.form.kelas = val; state.form.nama = ''; render(); }
function backToRole(){ state.view='role'; render(); }

function handlePhoto(which, input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      const maxW = 480;
      const scale = Math.min(1, maxW/img.width);
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
      state.form[which] = dataUrl;
      state.form[which+'Time'] = nowTime();
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function submitPiket(){
  const f = state.form;
  if(!f.nama || !f.kelas || !f.before) return;
  f.saving = true; f.msg=null; render();
  const date = todayStr();
  const docId = `${date}_${slug(f.nama)}-${slug(f.kelas)}`;
  const record = {
    nama: f.nama, kelas: f.kelas, tanggal: date,
    fotoSebelum: f.before, jamSebelum: f.beforeTime,
    fotoSesudah: f.after || null, jamSesudah: f.afterTime || null,
  };
  try{
    await db.collection(PIKET_COLLECTION).doc(docId).set(record);
    f.saving = false;
    f.msg = {ok:true, text: f.after ? 'Absensi lengkap terkirim ✓' : 'Foto sebelum tersimpan. Jangan lupa kirim foto sesudah piket nanti.'};
    render();
  }catch(err){
    f.saving = false;
    f.msg = {ok:false, text:'Gagal menyimpan. Coba lagi.'};
    render();
  }
}

/* ---------------- ADMIN LOGIN ---------------- */
function renderAdminLogin(){
  app.innerHTML = `
    <div class="topbar">
      <button class="back" onclick="backToRole()">&larr; Kembali</button>
    </div>
    <div class="login-box">
      <div class="brandmark" style="justify-content:center;"><div class="dot"></div><span>Masuk Admin</span></div>
      <input type="password" id="pin-input" placeholder="••••" maxlength="8">
      <button onclick="checkPin()">Masuk</button>
      <div id="pin-err" class="status-msg err hidden" style="margin-top:12px;">PIN salah, coba lagi.</div>
    </div>
  `;
  setTimeout(()=>{ const el=document.getElementById('pin-input'); if(el) el.focus(); },50);
}
function checkPin(){
  const val = document.getElementById('pin-input').value;
  if(val === ADMIN_PIN){ state.view='admin'; loadAdminData(); }
  else { document.getElementById('pin-err').classList.remove('hidden'); }
}

/* ---------------- ADMIN DASHBOARD ---------------- */
let adminRecords = [];
let adminLoading = false;

async function loadAdminData(){
  adminLoading = true; render();
  try{
    const snap = await db.collection(PIKET_COLLECTION).get();
    adminRecords = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
  }catch(e){
    adminRecords = [];
    console.error('Gagal memuat data dari Firestore:', e);
  }
  adminLoading = false;
  render();
}

function renderAdmin(){
  const filtered = adminRecords
    .filter(r => r.tanggal === adminDate)
    .filter(r => !adminSearch || (r.nama+' '+r.kelas).toLowerCase().includes(adminSearch.toLowerCase()))
    .sort((a,b)=> a.nama.localeCompare(b.nama));

  const total = filtered.length;
  const lengkap = filtered.filter(r=>r.fotoSesudah).length;
  const belum = total - lengkap;

  app.innerHTML = `
    <div class="topbar">
      <button class="back" onclick="backToRole()">&larr; Keluar</button>
      <div class="today-pill">Admin · ${fmtDate(adminDate)}</div>
    </div>

    <div class="stat-strip">
      <div class="stat"><div class="n">${total}</div><div class="l">Total Lapor</div></div>
      <div class="stat"><div class="n" style="color:var(--green)">${lengkap}</div><div class="l">Lengkap</div></div>
      <div class="stat"><div class="n" style="color:var(--amber-deep)">${belum}</div><div class="l">Belum Sesudah</div></div>
    </div>

    <div class="admin-toolbar">
      <input type="date" value="${adminDate}" onchange="adminDate=this.value; renderAdminOnly()">
      <input type="text" placeholder="Cari nama / kelas..." value="${adminSearch}" oninput="adminSearch=this.value; renderAdminOnly()">
      <div class="spacer"></div>
      <button class="upload-btn" style="width:auto;padding:9px 14px;" onclick="loadAdminData()">↻ Refresh</button>
      <button class="upload-btn" style="width:auto;padding:9px 14px;background:var(--ink-soft);" onclick="exportCsv()">⬇ Ekspor CSV</button>
    </div>

    ${adminLoading ? `<div class="loader">Memuat data...</div>` : renderTable(filtered)}

    <p class="footer-note">Data absensi bersifat bersama (shared) dan dapat dilihat semua pengguna yang mengakses halaman ini.</p>
  `;
}
function renderAdminOnly(){ render(); }

function renderTable(rows){
  if(rows.length===0){
    return `<div class="empty-state"><div class="icon">🗒️</div>Belum ada laporan piket untuk tanggal ini.</div>`;
  }
  return `
    <table>
      <thead><tr>
        <th>Nama</th><th>Kelas</th><th>Sebelum</th><th>Sesudah</th><th>Status</th><th></th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr>
            <td>${escapeHtml(r.nama)}</td>
            <td>${escapeHtml(r.kelas)}</td>
            <td>
              ${r.fotoSebelum ? `<img class="thumb" src="${r.fotoSebelum}" onclick="openLightbox('${r.fotoSebelum.replace(/'/g,"\\'")}')">` : `<div class="thumb empty">—</div>`}
              <div class="timestamp mono">${r.jamSebelum||''}</div>
            </td>
            <td>
              ${r.fotoSesudah ? `<img class="thumb" src="${r.fotoSesudah}" onclick="openLightbox('${r.fotoSesudah.replace(/'/g,"\\'")}')">` : `<div class="thumb empty">—</div>`}
              <div class="timestamp mono">${r.jamSesudah||''}</div>
            </td>
            <td>${r.fotoSesudah ? `<span class="badge done">Lengkap</span>` : `<span class="badge wait">Menunggu</span>`}</td>
            <td><button class="del-btn" onclick="deleteRecord('${r._id}')">Hapus</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

async function deleteRecord(docId){
  if(!confirm('Hapus data absensi ini?')) return;
  try{
    await db.collection(PIKET_COLLECTION).doc(docId).delete();
    adminRecords = adminRecords.filter(r => r._id !== docId);
    renderAdminOnly();
  }catch(e){ alert('Gagal menghapus data.'); }
}

function exportCsv(){
  const rows = adminRecords.filter(r=>r.tanggal===adminDate);
  let csv = 'Nama,Kelas,Tanggal,Jam Sebelum,Jam Sesudah,Status\n';
  rows.forEach(r=>{
    csv += `"${r.nama}","${r.kelas}","${r.tanggal}","${r.jamSebelum||''}","${r.jamSesudah||''}","${r.fotoSesudah?'Lengkap':'Menunggu'}"\n`;
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `rekap-piket-${adminDate}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function openLightbox(src){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){ document.getElementById('lightbox').classList.remove('show'); }

render();
</script>
</body>
</html>
